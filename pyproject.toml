[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "property-intel"
version = "0.1.0"
description = "Terminal-native New Zealand commercial property research"
requires-python = ">=3.12"
dependencies = ["textual>=0.80", "sqlalchemy>=2", "alembic>=1.13", "rapidfuzz>=3", "openpyxl>=3.1"]

[project.scripts]
property-intel = "property_intel.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/property_intel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
